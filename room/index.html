<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>tentative room</title>
<link rel="icon" href="../img/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zilla+Slab:wght@700&family=Noto+Sans+JP:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root { --ink:#1f2d45; --sub:#5b6475; --paper:#fff; --band:#f4f1ea; --line:#e3ded3;
          --orange:#f29a1f; --red:#e2352b; --blue:#2a5bd7; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--paper); color:var(--ink);
         font-family:"Noto Sans JP","Hiragino Sans",sans-serif; line-height:1.6; }
  a { color:inherit; }
  .stripe { height:6px; background:linear-gradient(90deg,var(--orange) 0 34%,var(--red) 34% 67%,var(--blue) 67%); }
  .wrap { max-width:1100px; margin:0 auto; padding:0 16px; }

  /* 入口 */
  #gate { min-height:80vh; display:flex; align-items:center; justify-content:center; text-align:center; }
  #gate img { width:120px; border-radius:50%; display:block; margin:0 auto 16px; }
  #gate h1 { font-family:"Zilla Slab",serif; margin:0 0 20px; font-size:26px; }
  #gate input { font-size:17px; padding:10px 14px; border:1.5px solid var(--ink); border-radius:8px; width:220px; }
  #gate button { font-size:16px; padding:10px 20px; border:0; border-radius:8px; background:var(--ink); color:#fff; margin-left:6px; cursor:pointer; }
  #gate .err { color:var(--red); font-size:14px; min-height:1.5em; margin-top:10px; }

  /* 中 */
  #room { display:none; padding-bottom:60px; }
  header { padding:24px 0 8px; display:flex; justify-content:space-between; align-items:baseline; gap:12px; flex-wrap:wrap; }
  header h1 { font-family:"Zilla Slab",serif; margin:0; font-size:26px; }
  header .jump { font-size:13px; color:var(--sub); }
  header .jump a { margin-right:10px; white-space:nowrap; }
  h2 { font-family:"Zilla Slab","Noto Sans JP",sans-serif; font-size:19px; margin:34px 0 12px;
       padding-bottom:6px; border-bottom:2px solid var(--ink); }
  h2 small { font-family:"Noto Sans JP",sans-serif; font-weight:400; color:var(--sub); font-size:13px; margin-left:8px; }
  .empty { color:var(--sub); font-size:14px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(200px,1fr)); gap:16px 12px; }
  .yt { position:relative; aspect-ratio:16/9; background:#000 center/cover no-repeat; border:0; padding:0;
        width:100%; display:block; cursor:pointer; border-radius:4px; overflow:hidden; }
  .yt iframe { position:absolute; inset:0; width:100%; height:100%; border:0; }
  .item p { margin:5px 0 0; font-size:13px; line-height:1.4; word-break:break-all; }
  .item p a { color:var(--sub); font-size:11px; margin-left:4px; }
  .chan { display:inline-block; padding:12px 18px; border:1.5px solid var(--ink); border-radius:8px; text-decoration:none; }
  .chan:hover { background:var(--ink); color:#fff; }
  .out { font-size:12px; color:var(--sub); background:none; border:0; text-decoration:underline; cursor:pointer; }
</style>
</head>
<body>
<div class="stripe"></div>

<div id="gate">
  <form>
    <img src="../img/girl.png" alt="">
    <h1>tentative room</h1>
    <input id="pw" type="password" placeholder="合言葉" autocomplete="current-password" autofocus>
    <button>入る</button>
    <div class="err" id="err"></div>
  </form>
</div>

<div id="room" class="wrap">
  <header>
    <h1>tentative room</h1>
    <div class="jump" id="jump"></div>
  </header>
  <div id="list"></div>
  <p style="margin-top:40px"><button class="out" id="out">この端末で合言葉を忘れる</button></p>
</div>

const ITER = 150000;

async function unlock(pw) {
  const raw = Uint8Array.from(atob(DATA), c => c.charCodeAt(0));
  const salt = raw.slice(8, 16), body = raw.slice(16);
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveBits"]);
  const bits = new Uint8Array(await crypto.subtle.deriveBits({ name: "PBKDF2", salt, iterations: ITER, hash: "SHA-256" }, base, 384));
  const key = await crypto.subtle.importKey("raw", bits.slice(0, 32), "AES-CBC", false, ["decrypt"]);
  const plain = await crypto.subtle.decrypt({ name: "AES-CBC", iv: bits.slice(32) }, key, body);
  return JSON.parse(new TextDecoder().decode(plain));
}

function esc(s) { return s.replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])); }

function show(sections) {
  const list = document.getElementById("list"), jump = document.getElementById("jump");
  sections.forEach((s, i) => {
    jump.insertAdjacentHTML("beforeend", `<a href="#s${i}">${esc(s.title)}</a>`);
    let html = `<h2 id="s${i}">${esc(s.title)}<small>${s.items.filter(x => x.id).length || ""}</small></h2>`;
    const vids = s.items.filter(x => x.id), chans = s.items.filter(x => x.channel);
    chans.forEach(c => html += `<p><a class="chan" href="https://www.youtube.com/channel/${c.channel}" target="_blank" rel="noopener">${esc(c.t)} →</a></p>`);
    if (!vids.length && !chans.length) html += `<p class="empty">まだありません。</p>`;
    if (vids.length) html += `<div class="grid">` + vids.map(v =>
      `<div class="item"><button class="yt" data-id="${v.id}" style="background-image:url(https://i.ytimg.com/vi/${v.id}/mqdefault.jpg)" aria-label="再生"></button>` +
      `<p>${esc(v.t)}<a href="https://youtu.be/${v.id}" target="_blank" rel="noopener">YouTube</a></p></div>`).join("") + `</div>`;
    list.insertAdjacentHTML("beforeend", html);
  });
  list.addEventListener("click", e => {
    const b = e.target.closest(".yt");
    if (!b || b.firstChild) return;
    b.innerHTML = `<iframe src="https://www.youtube-nocookie.com/embed/${b.dataset.id}?autoplay=1&rel=0" allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen></iframe>`;
  });
  document.getElementById("gate").style.display = "none";
  document.getElementById("room").style.display = "block";
}

async function tryOpen(pw, remember) {
  try {
    show(await unlock(pw));
    if (remember) try { localStorage.setItem("room-pw", pw); } catch (e) {}
    return true;
  } catch (e) { return false; }
}

document.querySelector("#gate form").addEventListener("submit", async e => {
  e.preventDefault();
  const ok = await tryOpen(document.getElementById("pw").value.trim(), true);
  if (!ok) document.getElementById("err").textContent = "合言葉がちがいます";
});
document.getElementById("out").addEventListener("click", () => {
  try { localStorage.removeItem("room-pw"); } catch (e) {}
  location.reload();
});
(async () => {
  let saved = null;
  try { saved = localStorage.getItem("room-pw"); } catch (e) {}
  if (saved && !(await tryOpen(saved, false))) try { localStorage.removeItem("room-pw"); } catch (e) {}
})();
</script>
</body>
</html>
