<script>
  document.querySelectorAll('.disc').forEach(sec => {
    const a = sec.querySelector('audio');
    const items = [...sec.querySelectorAll('li')];
    const starts = items.map(li => +li.querySelector('button').dataset.t);
    items.forEach((li, i) => li.querySelector('button').addEventListener('click', () => {
      document.querySelectorAll('audio').forEach(o => { if (o !== a) o.pause(); });
      a.currentTime = starts[i]; a.play();
    }));
    a.addEventListener('play', () => document.querySelectorAll('audio').forEach(o => { if (o !== a) o.pause(); }));
    a.addEventListener('timeupdate', () => {
      let k = 0; starts.forEach((s, i) => { if (a.currentTime >= s) k = i; });
      items.forEach((li, i) => li.classList.toggle('on', i === k));
    });
  });
</script>
