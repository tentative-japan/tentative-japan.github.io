<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Taro Mizuno</title>
<meta name="robots" content="noindex">
<link rel="icon" href="../img/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600&family=Zilla+Slab:wght@500;700&family=Noto+Sans+JP:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #1f2d45;
    --sub: #5b6475;
    --paper: #ffffff;
    --band: #f4f1ea;
    --orange: #f29a1f;
    --red: #e2352b;
    --blue: #2a5bd7;
    --line: #e3ded3;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--paper); color: var(--ink);
    font-family: "Noto Sans JP", "Hiragino Sans", sans-serif;
    line-height: 1.9; -webkit-font-smoothing: antialiased;
  }
  a { color: inherit; }
  .wrap { max-width: 880px; margin: 0 auto; padding: 0 20px; }
  .stripe { height: 6px; background: linear-gradient(90deg, var(--orange) 0 34%, var(--red) 34% 67%, var(--blue) 67% 100%); }

  header { padding: 56px 0 40px; }
  header h1 { font-family: "Zilla Slab", serif; font-weight: 700; font-size: 44px; margin: 0; line-height: 1.1; }
  header p { margin: 10px 0 0; color: var(--sub); font-size: 14px; letter-spacing: .08em; }
  header .back { font-size: 13px; color: var(--sub); text-decoration: none; }
  header .back:hover { color: var(--ink); text-decoration: underline; }

  section { padding: 64px 0; }
  section.alt { background: var(--band); }
  h2 { font-family: "Zilla Slab", serif; font-weight: 700; font-size: 30px; letter-spacing: .04em; margin: 0 0 8px; }
  h2::after {
    content: ""; display: block; width: 42px; height: 4px; margin-top: 8px;
    background: linear-gradient(90deg, var(--orange) 0 33%, var(--red) 33% 66%, var(--blue) 66%);
  }
  .lead { color: var(--sub); font-size: 14px; margin: 14px 0 28px; }

  /* 配信作品 */
  .release { display: grid; grid-template-columns: 1fr 1fr; gap: 36px; align-items: start; }
  .release img { width: 100%; height: auto; display: block; box-shadow: 0 10px 30px rgba(31,45,69,.18); }
  .release h3 { font-family: "Zilla Slab", serif; font-size: 28px; margin: 0 0 4px; line-height: 1.3; }
  .release .meta { color: var(--sub); font-size: 14px; margin: 0 0 18px; }
  .release iframe { width: 100%; height: 450px; border: 0; border-radius: 10px; margin-top: 22px; }
  .btn {
    display: inline-block; text-decoration: none; background: var(--ink); color: #fff;
    padding: 12px 26px; border-radius: 999px; font-size: 15px; letter-spacing: .05em;
  }
  .btn:hover { background: var(--blue); }

  /* リフ倉庫 */
  .riffs { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--line); }
  .riff { border-bottom: 1px solid var(--line); }
  .riff button.row {
    all: unset; box-sizing: border-box; cursor: pointer; width: 100%;
    display: grid; grid-template-columns: 40px 1fr auto; align-items: center; gap: 12px;
    padding: 12px 4px;
  }
  .riff button.row:focus-visible { outline: 2px solid var(--blue); outline-offset: -2px; }
  .riff .play {
    width: 34px; height: 34px; border-radius: 50%; border: 1.5px solid var(--ink);
    display: grid; place-items: center;
  }
  .riff .play::before {
    content: ""; margin-left: 3px;
    border-style: solid; border-width: 7px 0 7px 11px; border-color: transparent transparent transparent var(--ink);
  }
  .riff.on .play { background: var(--ink); }
  .riff.on.playing .play::before {
    margin: 0; width: 10px; height: 12px; border: 0;
    border-left: 3px solid #fff; border-right: 3px solid #fff;
  }
  .riff.on:not(.playing) .play::before { border-left-color: #fff; }
  .riff .t { font-size: 15px; }
  .riff .t small { display: block; color: var(--sub); font-size: 12px; line-height: 1.4; }
  .riff .d { font-family: "Zilla Slab", serif; color: var(--sub); font-size: 14px; }
  .riff .bar { display: none; padding: 0 4px 14px 56px; }
  .riff.on .bar { display: block; }
  .riff input[type=range] { width: 100%; accent-color: var(--red); }

  /* ギター写真館 */
  .guitars { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 28px; }
  .guitar { margin: 0; text-align: center; }
  .guitar .ph { position: relative; display: block; width: 100%; border: 0; padding: 0; background: none; }
  .guitar img { width: 100%; height: auto; display: block; border-radius: 4px; box-shadow: 0 6px 18px rgba(31,45,69,.14); }
  .guitar button.ph { cursor: pointer; }
  .guitar .ph .back { position: absolute; inset: 0; opacity: 0; transition: opacity .35s; }
  .guitar .ph.flip .back { opacity: 1; }
  .guitar .hint { position: absolute; right: 8px; bottom: 8px; background: rgba(255,255,255,.85); font-size: 11px; padding: 0 8px; border-radius: 99px; color: var(--sub); }
  .guitar figcaption { margin-top: 14px; }
  .guitar .tape {
    display: inline-block; padding: 2px 12px 1px; background: #efe7d2;
    box-shadow: 0 1px 2px rgba(0,0,0,.25);
    font-family: "Caveat", cursive; font-size: 21px; line-height: 1.2;
    transform: rotate(var(--r, -2deg));
  }

  footer { text-align: center; padding: 40px 0 48px; font-size: 12px; color: var(--sub); }

  @media (max-width: 680px) {
    header h1 { font-size: 36px; }
    section { padding: 52px 0; }
    .release { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
<div class="stripe"></div>

<header>
  <div class="wrap">
    <a class="back" href="../">← tentative</a>
    <h1>Taro Mizuno</h1>
    <p>guitar ／ tentative</p>
  </div>
</header>

<section class="alt" id="release">
  <div class="wrap">
    <h2>Solo Works</h2>
    <p class="lead">Taro Mizuno Project 名義のソロ作品。</p>
    <div class="release">
      <img src="img/distortion-sketch.jpg" alt="Distortion Sketch ジャケット">
      <div>
        <h3>Distortion Sketch</h3>
        <p class="meta">Taro Mizuno Project ／ 2024.12.12 release ／ 17曲</p>
        <a class="btn" href="https://music.apple.com/jp/album/distortion-sketch/1784629416" target="_blank" rel="noopener">配信で聴く</a>
        <iframe allow="autoplay *; encrypted-media *; clipboard-write" sandbox="allow-forms allow-popups allow-same-origin allow-scripts allow-top-navigation-by-user-activation" src="https://embed.music.apple.com/jp/album/distortion-sketch/1784629416" loading="lazy" title="Distortion Sketch"></iframe>
      </div>
    </div>
  </div>
</section>

<section id="riffs">
  <div class="wrap">
    <h2>Riff Box</h2>
    <p class="lead">ギターのインストと、リフのアイデア。曲になる前のかけら。</p>
    <ul class="riffs" id="riffs-list"></ul>
    <audio id="player" preload="none"></audio>
  </div>
</section>

<section class="alt" id="guitars">
  <div class="wrap">
    <h2>Guitars</h2>
    <p class="lead">うちのギター。</p>
    <div class="guitars" id="guitars-list"></div>
  </div>
</section>

<div class="stripe"></div>
<footer>© Taro Mizuno</footer>

<script>
  // リフ倉庫の中身は riffs/list.json（リフ箱フォルダの「Riff Boxを更新」で作り直される）
  var list = document.getElementById('riffs-list');
  var audio = document.getElementById('player');
  var current = null;

  function fmt(s) {
    if (!isFinite(s)) return '';
    s = Math.round(s);
    return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');
  }

  function addRiff(r) {
    var li = document.createElement('li');
    li.className = 'riff';
    li.innerHTML =
      '<button class="row"><span class="play"></span>' +
      '<span class="t"></span><span class="d"></span></button>' +
      '<div class="bar"><input type="range" min="0" max="1000" value="0" aria-label="再生位置"></div>';
    li.querySelector('.t').innerHTML = '<span></span><small></small>';
    li.querySelector('.t span').textContent = r.title;
    li.querySelector('.t small').textContent = r.date;
    // 長さだけ先に読む
    var probe = new Audio();
    probe.preload = 'metadata';
    probe.src = 'riffs/' + r.file;
    probe.addEventListener('loadedmetadata', function () { li.querySelector('.d').textContent = fmt(probe.duration); });

    li.querySelector('button.row').addEventListener('click', function () {
      if (current === li) {
        audio.paused ? audio.play() : audio.pause();
        return;
      }
      if (current) current.classList.remove('on', 'playing');
      current = li;
      li.classList.add('on');
      audio.src = 'riffs/' + r.file;
      audio.play();
    });
    li.querySelector('input').addEventListener('input', function (e) {
      if (current === li && audio.duration) audio.currentTime = audio.duration * e.target.value / 1000;
    });
    list.appendChild(li);
  }
  fetch('riffs/list.json', { cache: 'no-cache' })
    .then(function (res) { return res.json(); })
    .then(function (items) { items.forEach(addRiff); });

  audio.addEventListener('play', function () { current && current.classList.add('playing'); });
  audio.addEventListener('pause', function () { current && current.classList.remove('playing'); });
  audio.addEventListener('timeupdate', function () {
    if (!current || !audio.duration) return;
    current.querySelector('input').value = Math.round(audio.currentTime / audio.duration * 1000);
    current.querySelector('.d').textContent = fmt(audio.currentTime) + ' / ' + fmt(audio.duration);
  });
  // 終わったら次のリフへ
  audio.addEventListener('ended', function () {
    var next = current && current.nextElementSibling;
    if (next) next.querySelector('button.row').click();
    else if (current) current.classList.remove('playing');
  });

  // ギター写真は guitars/list.json（ギター写真フォルダの「写真館を更新」で作り直される）
  var TILT = ['-2deg', '1.5deg', '-1deg', '2deg', '-2.5deg', '1deg'];
  fetch('guitars/list.json', { cache: 'no-cache' })
    .then(function (res) { return res.json(); })
    .then(function (items) {
      var box = document.getElementById('guitars-list');
      items.forEach(function (g, i) {
        var fig = document.createElement('figure');
        fig.className = 'guitar';
        var ph = document.createElement(g.back ? 'button' : 'span');
        ph.className = 'ph';
        var img = new Image();
        img.src = 'guitars/' + g.front; img.alt = g.name; img.loading = 'lazy';
        ph.appendChild(img);
        if (g.back) {
          // 写真を押すと裏が見える
          ph.setAttribute('aria-label', g.name + ' の裏も見る');
          var back = new Image();
          back.className = 'back'; back.src = 'guitars/' + g.back; back.alt = g.name + ' 裏'; back.loading = 'lazy';
          ph.appendChild(back);
          var hint = document.createElement('span');
          hint.className = 'hint'; hint.textContent = 'tap ↻';
          ph.appendChild(hint);
          ph.addEventListener('click', function () { ph.classList.toggle('flip'); });
        }
        var cap = document.createElement('figcaption');
        var tape = document.createElement('span');
        tape.className = 'tape'; tape.textContent = g.name;
        tape.style.setProperty('--r', TILT[i % TILT.length]);
        cap.appendChild(tape);
        fig.appendChild(ph); fig.appendChild(cap);
        box.appendChild(fig);
      });
    });
</script>
</body>
</html>
